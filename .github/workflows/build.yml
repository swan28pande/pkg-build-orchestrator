name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  example:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: canonical/setup-lxd@v0.1.3
      - run: pip install .
      - run: pkgbuild plan examples/hello
      - run: pkgbuild build examples/hello --backend lxd --targets wheel,deb,snap --out dist-pkgbuild
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: dist-pkgbuild/
