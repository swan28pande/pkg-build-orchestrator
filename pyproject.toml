[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pkg-build-orchestrator"
version = "0.1.0"
description = "Reproducible deb, wheel and snap builds inside LXD containers"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
pkgbuild = "pkgbuild.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
