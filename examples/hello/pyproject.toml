[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hello-pkgbuild"
version = "0.1.0"
description = "Example project for pkg-build-orchestrator"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[project.scripts]
hello = "hello.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pkgbuild]
image = "ubuntu:24.04"
targets = ["wheel", "deb", "snap"]
